ta-qualified-name="GameOver" id="ent0004" data-source-line="41"><rect x="453" y="536.988" width="249.066" height="85.953" fill="#FFF" style="stroke:#444;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="453" y1="579.965" x2="702.066" y2="579.965" style="stroke:#444;stroke-width:0.5;"/><text x="518.248" y="555.523" fill="#000" font-size="14" textLength="82.893" font-family="'Noto Sans CJK KR'">GAME_OVER</text><text x="518.248" y="572.012" fill="#000" font-size="14" textLength="118.569" font-family="'Noto Sans CJK KR'">(GameOverPhase)</text><text x="458" y="598.5" fill="#000" font-size="14" textLength="137.081" font-family="'Noto Sans CJK KR'">result(): GameResult</text><text x="458" y="614.988" fill="#000" font-size="14" textLength="229.066" font-family="'Noto Sans CJK KR'">모든 입력 WRONG_PHASE, tick false</text></g><g class="start_entity" data-qualified-name=".start." id="ent0005" data-source-line="21"><ellipse cx="436.5" cy="59.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0012" data-source-line="50"><ellipse cx="577.5" cy="695.988" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="577.5" cy="695.988" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="53"><path d="M6,175.488 L6,246.73 A0,0 0 0 0 6,246.73 L316.634,246.73 A0,0 0 0 0 316.634,246.73 L316.634,214.988 L335.427,210.988 L316.634,206.988 L316.634,185.488 L306.634,175.488 L6,175.488 A0,0 0 0 0 6,175.488" style="stroke:#C9B458;stroke-width:0.5;" fill="#FFFBE6"/><path d="M306.634,175.488 L306.634,185.488 L316.634,185.488 L306.634,175.488" style="stroke:#C9B458;stroke-width:0.5;" fill="#FFFBE6"/><text x="12" y="193.057" fill="#000" font-size="13" textLength="289.634" font-family="'Noto Sans CJK KR'">New Game 버튼(TwoPlayerSession.newGame)은</text><text x="12" y="208.367" fill="#000" font-size="13" textLength="255.158" font-family="'Noto Sans CJK KR'">어느 단계에서든 새 보드·새 TwoPlayerGame을</text><text x="12" y="223.678" fill="#000" font-size="13" textLength="215.342" font-family="'Noto Sans CJK KR'">만들어 PLACEMENT부터 다시 시작한다.</text><text x="12" y="238.988" fill="#000" font-size="13" textLength="224.3" font-family="'Noto Sans CJK KR'">예전 게임 객체는 버린다(단계 전이가 아님).</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="60"><path d="M617.5,355.988 L617.5,395.488 L599.594,399.488 L617.5,403.488 L617.5,442.541 A0,0 0 0 0 617.5,442.541 L869.703,442.541 A0,0 0 0 0 869.703,442.541 L869.703,365.988 L859.703,355.988 L617.5,355.988 A0,0 0 0 0 617.5,355.988" style="stroke:#C9B458;stroke-width:0.5;" fill="#FFFBE6"/><path d="M859.703,355.988 L859.703,365.988 L869.703,365.988 L859.703,355.988" style="stroke:#C9B458;stroke-width:0.5;" fill="#FFFBE6"/><text x="623.5" y="373.557" fill="#000" font-size="13" textLength="231.203" font-family="'Noto Sans CJK KR'">배치·개입이 끝나면 이 단계로 바뀌기만 하고,</text><text x="623.5" y="388.867" fill="#000" font-size="13" textLength="197.849" font-family="'Noto Sans CJK KR'">세대는 시계 tick마다 1개씩 진행한다.</text><text x="623.5" y="404.178" fill="#000" font-size="13" textLength="171.125" font-family="'Noto Sans CJK KR'">정체돼도 K세대를 모두 진행한다.</text><text x="623.5" y="419.488" fill="#000" font-size="13" textLength="117.918" font-family="'Noto Sans CJK KR'">K번째 세대에 전멸하면</text><text x="623.5" y="434.799" fill="#000" font-size="13" textLength="149.758" font-family="'Noto Sans CJK KR'">r &lt; R이어도 개입 없이 종료.</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="68"><path d="M167.5,676.488 L167.5,717.109 A0,0 0 0 0 167.5,717.109 L423.816,717.109 A0,0 0 0 0 423.816,717.109 L423.816,686.488 L413.816,676.488 L299.5,676.488 L295.5,639.499 L291.5,676.488 L167.5,676.488 A0,0 0 0 0 167.5,676.488" style="stroke:#C9B458;stroke-width:0.5;" fill="#FFFBE6"/><path d="M413.816,676.488 L413.816,686.488 L423.816,686.488 L413.816,676.488" style="stroke:#C9B4